<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fateline – Host</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<style>
  :root { --gold: #c9a84c; --deep: #0d0a0e; --card-bg: #1a1520; --accent: #8b4cf7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--deep); color: #e8dcc8; font-family: 'Crimson Pro', serif; min-height: 100vh; }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 20% 40%, rgba(139,76,247,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .host-layout { max-width: 1100px; margin: 0 auto; padding: 2rem; }
  h1 { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--gold); margin-bottom: 0.2rem; }
  .host-badge { display: inline-block; background: rgba(139,76,247,0.2); border: 1px solid rgba(139,76,247,0.4); border-radius: 4px; padding: 0.2rem 0.6rem; font-size: 0.75rem; font-family: 'Cinzel', serif; color: #b88af0; letter-spacing: 0.1em; margin-bottom: 1.5rem; }
  .code-display { background: var(--card-bg); border: 1px solid rgba(201,168,76,0.3); border-radius: 12px; padding: 1.5rem 2rem; margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; }
  .code-label { font-size: 0.8rem; font-family: 'Cinzel', serif; letter-spacing: 0.15em; color: rgba(232,220,200,0.5); text-transform: uppercase; }
  .code-value { font-family: 'Cinzel', serif; font-size: 3rem; font-weight: 900; color: var(--gold); letter-spacing: 0.2em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .panel { background: var(--card-bg); border: 1px solid rgba(201,168,76,0.15); border-radius: 12px; padding: 1.5rem; }
  .panel h3 { font-family: 'Cinzel', serif; font-size: 0.9rem; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; margin-bottom: 1rem; }
  .player-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .player-item:last-child { border-bottom: none; }
  .role-badge { font-size: 0.7rem; font-family: 'Cinzel', serif; padding: 0.15rem 0.5rem; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
  .court { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
  .monster { background: rgba(139,76,247,0.15); color: #b88af0; border: 1px solid rgba(139,76,247,0.3); }
  .fate-line { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .fate-dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; transition: all 0.3s; }
  .fate-dot.filled-courts { background: var(--gold); border-color: var(--gold); }
  .fate-dot.filled-monsters { background: var(--accent); border-color: var(--accent); }
  .total-display { font-family: 'Cinzel', serif; font-size: 4rem; font-weight: 900; color: #fff; text-align: center; }
  .total-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
  .total-fill { height: 100%; border-radius: 4px; transition: width 0.5s, background 0.3s; }
  .log { max-height: 200px; overflow-y: auto; }
  .log-entry { font-size: 0.9rem; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); color: rgba(232,220,200,0.7); }
  .start-btn { background: linear-gradient(135deg, #c9a84c, #8b6820); border: none; border-radius: 8px; padding: 1rem 2rem; color: #0d0a0e; font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; text-transform: uppercase; transition: all 0.2s; margin-top: 1rem; }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.4); }
  .current-player { background: rgba(139,76,247,0.1); border: 1px solid rgba(139,76,247,0.3); border-radius: 6px; padding: 0.5rem 1rem; text-align: center; margin-bottom: 1rem; }
  #game-board { display: none; }
</style>
</head>
<body>
<div class="host-layout">
  <div class="host-badge">HOST VIEW</div>
  <h1>Fateline</h1>

  <div id="lobby-view">
    <div class="code-display">
      <div>
        <div class="code-label">Game Code</div>
        <div class="code-value">{{code}}</div>
      </div>
      <div style="text-align:right">
        <div class="code-label">Players</div>
        <div style="font-family:'Cinzel',serif;font-size:2rem;color:#fff"><span id="player-count">0</span>/{{max_players}}</div>
      </div>
    </div>
    <ul id="player-list" style="list-style:none;margin-bottom:1rem">
      <li style="color:rgba(232,220,200,0.3);font-style:italic">Waiting for players to join...</li>
    </ul>
    <button class="start-btn" onclick="startGame()">Start Game</button>
  </div>

  <div id="game-board">
    <div class="grid">
      <div>
        <div class="panel" style="margin-bottom:1.5rem">
          <h3>Running Total</h3>
          <div class="total-display" id="total">0</div>
          <div style="font-size:0.8rem;text-align:center;color:rgba(232,220,200,0.4);margin-top:0.25rem">Bust at 14+</div>
          <div class="total-bar"><div class="total-fill" id="total-fill" style="width:0%;background:var(--gold)"></div></div>
        </div>
        <div class="panel">
          <h3>Fate Line</h3>
          <div style="margin-bottom:1rem">
            <div style="font-size:0.8rem;color:var(--gold);margin-bottom:0.3rem;font-family:'Cinzel',serif">Courts</div>
            <div class="fate-line" id="fate-courts"></div>
          </div>
          <div>
            <div style="font-size:0.8rem;color:#b88af0;margin-bottom:0.3rem;font-family:'Cinzel',serif">Monsters</div>
            <div class="fate-line" id="fate-monsters"></div>
          </div>
        </div>
      </div>
      <div>
        <div class="panel" style="margin-bottom:1.5rem">
          <h3>Players</h3>
          <div id="current-player" class="current-player">Waiting...</div>
          <div id="players-board"></div>
        </div>
        <div class="panel">
          <h3>Event Log</h3>
          <div class="log" id="log"></div>
        </div>
      </div>
    </div>
    <div id="nay-sire-prompt" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:100;">
    <div style="background:var(--card-bg); border:1px solid rgba(201,168,76,0.4); border-radius:12px; padding:2rem; text-align:center; max-width:400px;">
    <div style="font-family:'Cinzel',serif; color:var(--gold); font-size:1.1rem; margin-bottom:0.5rem;">Nay Sire?</div>
    <div id="nay-sire-text" style="color:rgba(232,220,200,0.7); margin-bottom:1.5rem; font-size:0.95rem;"></div>
    <div style="display:flex; gap:1rem; justify-content:center;">
      <button onclick="resolveNaySire(true)"  class="start-btn" style="padding:0.6rem 1.5rem;">Block It</button>
      <button onclick="resolveNaySire(false)" class="start-btn" style="padding:0.6rem 1.5rem; background:linear-gradient(135deg,#4a4a4a,#2a2a2a); color:#e8dcc8;">Allow</button>
    </div>
  </div>
</div>
  </div>
</div>
<script>
  const socket = io();
  const gameCode = "{{code}}";
  const fateLength = 5;
  
  socket.emit("host_join", {game_code: gameCode});
  
  socket.on("player_joined", (data) => {
    document.getElementById("player-count").textContent = data.player_count;
    const list = document.getElementById("player-list");
    if (list.querySelector("li")) list.innerHTML = "";
    const li = document.createElement("li");
    li.textContent = "⚔ " + data.player_name;
    li.style.cssText = "padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05);";
    list.appendChild(li);
  });
  
  socket.on("game_state", (data) => {
    document.getElementById("lobby-view").style.display = "none";
    document.getElementById("game-board").style.display = "block";
    
    // Total
    const total = data.running_total;
    document.getElementById("total").textContent = total;
    const pct = Math.min(100, (total / 13) * 100);
    const fill = document.getElementById("total-fill");
    fill.style.width = pct + "%";
    fill.style.background = total >= 11 ? "#ef4444" : total >= 8 ? "#f59e0b" : "var(--gold)";
    
    // Fate line
    const fp = data.fate_points;
    ["courts", "monsters"].forEach(team => {
      const el = document.getElementById("fate-" + team);
      el.innerHTML = "";
      for (let i = 0; i < fateLength; i++) {
        const dot = document.createElement("div");
        dot.className = "fate-dot" + (i < (fp[team] || 0) ? " filled-" + team : "");
        dot.textContent = i < (fp[team] || 0) ? "★" : "☆";
        el.appendChild(dot);
      }
    });
    
    // Players
    const cur = data.players[data.current_player_idx];
    if (cur) document.getElementById("current-player").textContent = "🎭 Current: " + cur.name;
    
    const board = document.getElementById("players-board");
    board.innerHTML = "";
    data.players.forEach((p, i) => {
      const div = document.createElement("div");
      div.className = "player-item";
      div.innerHTML = `
        <span style="flex:1">${p.name}</span>
        <span class="role-badge ${p.team}">${p.role}</span>
        <span style="font-size:0.8rem;color:rgba(232,220,200,0.4)">${p.card_count} cards</span>
        ${i === data.current_player_idx ? '<span style="color:var(--gold)">◀</span>' : ''}
      `;
      board.appendChild(div);
    });
    
    // Log
    const logEl = document.getElementById("log");
    logEl.innerHTML = "";
    (data.log || []).forEach(entry => {
      const d = document.createElement("div");
      d.className = "log-entry";
      d.textContent = entry;
      logEl.appendChild(d);
    });
    logEl.scrollTop = logEl.scrollHeight;

  const pa = data.pending_action;
    const prompt = document.getElementById("nay-sire-prompt");
    if (pa && pa.type === "nay_sire_check") {
      document.getElementById("nay-sire-text").textContent =
        `${pa.target_name} has a Nay Sire — can they block the ${pa.card_label}?`;
      prompt.style.display = "flex";
    } else {
      prompt.style.display = "none";
    }
  });
  
  function startGame() {
    socket.emit("start_game", {game_code: gameCode});
  }
  function resolveNaySire(blocked) {
    socket.emit("nay_sire_response", { game_code: gameCode, blocked: blocked });
  }
</script>
</body>
</html>
