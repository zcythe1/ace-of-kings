<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fateline — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c9a84c; --deep: #0d0a0e; --card-bg: #1a1520; --accent: #8b4cf7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--deep);
    color: #e8dcc8;
    font-family: 'Crimson Pro', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 40%, rgba(139,76,247,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 70%, rgba(201,168,76,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .container {
    max-width: 480px;
    width: 100%;
    padding: 2rem;
    text-align: center;
  }

  .crest {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    animation: floatIn 0.8s ease-out;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: 3rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 0.3rem;
    animation: floatIn 0.8s ease-out 0.1s both;
  }

  .tagline {
    font-style: italic;
    color: rgba(232,220,200,0.4);
    font-size: 1rem;
    margin-bottom: 2.5rem;
    animation: floatIn 0.8s ease-out 0.2s both;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 16px;
    padding: 2rem;
    animation: floatIn 0.8s ease-out 0.3s both;
  }

  .panel p {
    color: rgba(232,220,200,0.7);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .key-section label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: rgba(232,220,200,0.4);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    text-align: left;
  }

  .key-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    color: #e8dcc8;
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    text-align: center;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 0.8rem;
  }
  .key-input:focus {
    border-color: rgba(201,168,76,0.6);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
  }
  .key-input::placeholder {
    color: rgba(232,220,200,0.2);
    letter-spacing: 0.1em;
  }

  .submit-btn {
    width: 100%;
    background: linear-gradient(135deg, #c9a84c, #8b6820);
    border: none;
    border-radius: 8px;
    padding: 0.9rem 2rem;
    color: #0d0a0e;
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(201,168,76,0.35);
  }

  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    color: #fca5a5;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="crest">⚜</div>
  <h1>Fateline</h1>
  <p class="tagline">Admin access only.</p>

  <div class="panel">
    <p>Enter the admin password to access the developer host panel.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="key-section">
        <label>Admin Password</label>
        <input
          class="key-input"
          type="password"
          name="password"
          placeholder="••••••••••"
          autofocus
          autocomplete="off"
        >
      </div>
      <button class="submit-btn" type="submit">Enter the Arena</button>
    </form>
  </div>
</div>
</body>
</html>
